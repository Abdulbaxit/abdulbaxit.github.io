name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  # Lets you re-run a deploy from the Actions tab without a new commit.
  workflow_dispatch:
  # Daily rebuild, so the GitHub activity section stays current.
  schedule:
    - cron: "0 3 * * *"

permissions:
  contents: read
  pages: write
  id-token: write

# Let an in-flight deploy finish rather than cancelling it mid-publish.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      - name: Build
        # A project repo is served from /<repo>/, a <user>.github.io repo
        # from the root. This derives the right basePath either way, so a
        # rename of the repo does not silently 404 every asset. Compared in
        # lowercase: the owner is "Abdulbaxit", the repo "abdulbaxit.github.io".
        run: |
          REPO="${GITHUB_REPOSITORY#*/}"
          USER_SITE="$(echo "${GITHUB_REPOSITORY_OWNER}.github.io" | tr '[:upper:]' '[:lower:]')"
          if [ "$(echo "$REPO" | tr '[:upper:]' '[:lower:]')" = "$USER_SITE" ]; then
            echo "User site: serving from root"
            export NEXT_PUBLIC_BASE_PATH=""
          else
            echo "Project site: serving from /$REPO"
            export NEXT_PUBLIC_BASE_PATH="/$REPO"
          fi
          npm run build

      - name: Add .nojekyll
        # Without this, Pages runs Jekyll and drops the _next directory.
        run: touch out/.nojekyll

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
